name: NSE Market Leader Daily Tracker

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  track-leaders:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Clear pip cache
        run: pip cache purge
      - name: Install dependencies with explicit versions
        run: |
          python -m pip install --upgrade pip --no-cache-dir
          python -m pip install --no-cache-dir nsefin==0.1.5 pandas requests beautifulsoup4  
      
      - name: Run market leader tracker
        run: python nse_market_leader_tracker.py
      
      - name: Commit and push data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add nse_market_data/
          git commit -m "chore: update market leader data $(date +'%Y-%m-%d')" || echo "No changes"
          git push
        continue-on-error: true
