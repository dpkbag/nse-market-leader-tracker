name: NSE Market Leader Daily Tracker

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  track-leaders:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install --no-cache-dir nsefin==0.1.5 pandas requests beautifulsoup4
      
      - run: python nse_market_leader_tracker.py
      
      - run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add nse_market_data/ || true
          git commit -m "chore: update market leader data $(date +'%Y-%m-%d')" || true
          git push || true
